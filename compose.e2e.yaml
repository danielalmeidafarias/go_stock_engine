name: go-stock-engine-e2e

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: stock_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_e2e"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: stock_e2e
      REPOSITORY_TYPE: POSTGRES
      HANDLER_TYPE: HTTP
      PAGINATION_DEFAULT_LIMIT: "20"
      PAGINATION_MAX_LIMIT: "100"
      PRIORITY_USE_POLICY: "false"
      PRIORITY_NEGATIVE_STOCK_FACTOR: "1.0"
      PRIORITY_LEAD_TIME_FACTOR: "1.0"
      PRIORITY_ZERO_SALES_FACTOR: "1.0"
    ports:
      - "8081:8080"
